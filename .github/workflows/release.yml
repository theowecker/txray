name: release

on:
  push:
    branches: [ main ]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Release only when the version has no tag yet
        run: |
          version="$(ruby -Ilib -r txray/version -e 'print Txray::VERSION')"
          echo "number=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "txray ${version} is already tagged, nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "txray ${version} has no tag yet, releasing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.version.outputs.publish == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Take the release notes from the changelog
        if: steps.version.outputs.publish == 'true'
        run: |
          awk -v v="## ${{ steps.version.outputs.number }}" \
            '$0 == v {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "CHANGELOG.md has no section for ${{ steps.version.outputs.number }}" >&2
            exit 1
          fi

      - name: Run the suite before publishing anything
        if: steps.version.outputs.publish == 'true'
        run: bundle exec rake

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git tag -a "v${{ steps.version.outputs.number }}" -m "txray ${{ steps.version.outputs.number }}"

      - name: Publish to rubygems.org
        if: steps.version.outputs.publish == 'true'
        uses: rubygems/release-gem@v1

      - name: Push the tag once the gem is published
        if: steps.version.outputs.publish == 'true'
        run: git push origin "v${{ steps.version.outputs.number }}"

      - name: Publish the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.number }}" \
            --title "v${{ steps.version.outputs.number }}" \
            --notes-file "${RUNNER_TEMP}/notes.md" pkg/*.gem
